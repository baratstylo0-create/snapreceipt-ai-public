<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Receipt Analyser</title>
  <!-- Treehouse typefaces (Mugi's design): Spectral (serif display) + Nunito Sans (body).
       CSP allows fonts.googleapis.com (style-src) + fonts.gstatic.com (font-src). -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Nunito+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <!-- All styling lives in external CSS; a strict CSP (no inline styles) is enforced. -->
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <!-- App shell only. Empty mount points are populated by later frontend tasks.
       No inline <script>, no inline styles, no on*= handlers anywhere (CSP-ready). -->
  <header id="app-header" class="app-header"></header>
  <main id="app" class="app-main"></main>
  <div id="app-modal" class="app-modal" hidden></div>
  <footer id="app-footer" class="app-footer"></footer>

  <!-- Foundation modules. Order matters: escape.js first (globals other modules
       depend on), then api/render, then authgate + nav, then the app entrypoint
       which reads all of them and boots the shell. All external (no inline JS). -->
  <script src="js/escape.js"></script>
  <script src="js/api.js"></script>
  <script src="js/render.js"></script>
  <script src="js/format.js"></script>
  <script src="js/authgate.js"></script>
  <script src="js/components/nav.js"></script>
  <script src="js/components/overview.js"></script>
  <script src="js/components/activity.js"></script>
  <script src="js/components/upload.js"></script>
  <script src="js/components/templates.js"></script>
  <script src="js/components/reports.js"></script>
  <script src="js/components/agent.js"></script>
  <script src="js/components/settings.js"></script>
  <!-- falc.js reuses agent.js (the Agent chat module), so it must load after it. -->
  <script src="js/components/falc.js"></script>
  <script src="js/components/ratemeter.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
