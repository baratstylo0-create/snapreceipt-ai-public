name: Deploy (Premala VPS)

# Auto-deploys to the live Premala instance on every push to main (i.e. every
# merge). Tests run again here as a hard gate — a red suite never reaches the
# VPS, even if something upstream was mis-tagged green. Packaging uses
# `git archive`, which only ever includes files git tracks — .env and
# node_modules are gitignored, so they structurally cannot end up in the
# deployed artifact, no --exclude flags to forget.
#
# Runs as the unprivileged `deploy` VPS user (own pm2 daemon, chown'd only to
# /opt/receipt-analyser, zero sudo) — never root. See /opt/README.md on the
# VPS for the shared-tenancy rule this account respects by construction: it
# cannot touch Barat's frictionai/quote-server/health-monitor even if this
# workflow had a bug.

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Test gate — a red suite never reaches the VPS
        run: npm test

      - name: Package (git-tracked files only — .env/.git/node_modules can never leak in)
        run: git archive --format=tar.gz -o /tmp/deploy.tar.gz HEAD

      - name: Configure deploy SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload artifact
        run: scp -i ~/.ssh/deploy_key /tmp/deploy.tar.gz deploy@${{ secrets.VPS_HOST }}:/tmp/deploy.tar.gz

      - name: Extract + restart (deploy user, no sudo, no root, cannot touch other projects on the box)
        run: |
          ssh -i ~/.ssh/deploy_key deploy@${{ secrets.VPS_HOST }} '
            set -e
            tar -xzf /tmp/deploy.tar.gz -C /opt/receipt-analyser
            rm -f /tmp/deploy.tar.gz
            cd /opt/receipt-analyser && npm ci --omit=dev
            pm2 restart receipt-analyser --update-env
          '

      - name: Verify — health + readiness must both be green post-deploy
        run: |
          sleep 4
          curl -sk --fail "https://${{ secrets.VPS_HOST }}/health"
          curl -sk --fail "https://${{ secrets.VPS_HOST }}/ready"
