name: Deploy (SnapReceipt AI VPS)

# Auto-deploys the live PERSONAL SnapReceipt AI instance (snapreceiptai.friction.com.my,
# pm2 process "snapreceipt-ai", /opt/snapreceipt-ai, port 3104) on every push to main
# (i.e. every merge). Tests run again here as a hard gate — a red suite never reaches
# the VPS, even if something upstream was mis-tagged green. Packaging uses
# `git archive`, which only ever includes files git tracks — .env and
# node_modules are gitignored, so they structurally cannot end up in the
# deployed artifact, no --exclude flags to forget.
#
# 2026-08-12 fix: this workflow was copied from the separate Premala (business)
# repo's deploy.yml and never repointed — it was deploying to /opt/receipt-analyser
# (a different, unrelated pm2 process on port 3005), never touching the actual live
# snapreceipt-ai app, and had no VPS_DEPLOY_SSH_KEY/VPS_HOST secrets configured for
# THIS repo at all, so it always failed at the SSH-key step. Fixed to target the
# real live directory/process and use this repo's own secrets.
#
# Runs as the unprivileged `deploy` VPS user (own pm2 daemon, chown'd only to
# /opt/snapreceipt-ai, zero sudo) — never root. See /opt/README.md on the
# VPS for the shared-tenancy rule this account respects by construction: it
# cannot touch Barat's frictionai/quote-server/health-monitor/receipt-analyser
# even if this workflow had a bug.

on:
  push:
    branches: [main]

# 2026-07-13: a backlog of queued runs (Actions minutes exhaustion) released #222 and #223
# together — both jobs shared the fixed /tmp/deploy.tar.gz path on the VPS with no lock, so one
# run's `rm -f` / upload raced the other's `tar -xzf`, and the losing run failed with
# "Cannot open: No such file or directory" even though the OTHER run's deploy (from the same or a
# newer main tip) succeeded moments later. `cancel-in-progress: false` so we queue, never drop, a
# real deploy — a stale run is superseded by deploying a newer main anyway.
concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Test gate — a red suite never reaches the VPS
        run: npm test

      - name: Package (git-tracked files only — .env/.git/node_modules can never leak in)
        # Unique filename per run (defense-in-depth alongside the concurrency lock above): even a
        # stale/out-of-order run can never clobber or delete another run's in-flight artifact.
        run: git archive --format=tar.gz -o /tmp/deploy-${{ github.run_id }}.tar.gz HEAD

      - name: Configure deploy SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload artifact
        run: scp -i ~/.ssh/deploy_key /tmp/deploy-${{ github.run_id }}.tar.gz deploy@${{ secrets.VPS_HOST }}:/tmp/deploy-${{ github.run_id }}.tar.gz

      - name: Extract + restart (deploy user, no sudo, no root, cannot touch other projects on the box)
        run: |
          ssh -i ~/.ssh/deploy_key deploy@${{ secrets.VPS_HOST }} '
            set -e
            tar -xzf /tmp/deploy-${{ github.run_id }}.tar.gz -C /opt/snapreceipt-ai
            rm -f /tmp/deploy-${{ github.run_id }}.tar.gz
            cd /opt/snapreceipt-ai && npm ci --omit=dev
            pm2 restart snapreceipt-ai --update-env
          '

      - name: Verify — health + readiness must both be green post-deploy
        run: |
          sleep 4
          curl -sk --fail "https://${{ secrets.VPS_HOST }}/health"
          curl -sk --fail "https://${{ secrets.VPS_HOST }}/ready"
