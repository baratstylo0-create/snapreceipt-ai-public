apply plugin: 'com.android.application'
import groovy.json.JsonSlurper

def envValue = { name -> System.getenv(name)?.trim() }
def uploadKeystorePath = envValue('ANDROID_KEYSTORE_PATH')
def uploadKeystorePassword = envValue('ANDROID_KEYSTORE_PASSWORD')
def uploadKeyAlias = envValue('ANDROID_KEY_ALIAS')
def uploadKeyPassword = envValue('ANDROID_KEY_PASSWORD')
def capacitorServerUrl = envValue('CAPACITOR_SERVER_URL')
def releaseSigningConfigured = uploadKeystorePath && uploadKeystorePassword && uploadKeyAlias && uploadKeyPassword
def releaseServerConfigured = capacitorServerUrl ==~ /^https:\/\/[^\/\s]+(?:\/.*)?$/
def bundledCapacitorConfig = file('src/main/assets/capacitor.config.json')

def bundledServerUrl = {
    if (!bundledCapacitorConfig.exists()) return ''
    try {
        def parsed = new JsonSlurper().parse(bundledCapacitorConfig)
        return (parsed.server?.url ?: '').toString().trim().replaceAll('/$', '')
    } catch (Exception ignored) {
        return ''
    }
}

android {
    namespace = "com.snapreceiptai.app"
    compileSdk = rootProject.ext.compileSdkVersion

    if (releaseSigningConfigured) {
        signingConfigs {
            release {
                storeFile file(uploadKeystorePath)
                storePassword uploadKeystorePassword
                keyAlias uploadKeyAlias
                keyPassword uploadKeyPassword
            }
        }
    }

    defaultConfig {
        applicationId "com.snapreceiptai.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (releaseSigningConfigured) {
                signingConfig signingConfigs.release
            }
        }
    }
}

afterEvaluate {
    tasks.matching { it.name in ['bundleRelease', 'assembleRelease'] }.configureEach {
        doFirst {
            if (!releaseServerConfigured) {
                throw new GradleException('Release builds require CAPACITOR_SERVER_URL to be an HTTPS production URL.')
            }
            if (bundledServerUrl() != capacitorServerUrl.replaceAll('/$', '')) {
                throw new GradleException('Capacitor assets are stale or missing. Run npx cap sync android after setting CAPACITOR_SERVER_URL.')
            }
            if (!releaseSigningConfigured) {
                throw new GradleException('Release signing is not configured. Set ANDROID_KEYSTORE_PATH, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD before building.')
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
